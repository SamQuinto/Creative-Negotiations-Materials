scales:
  agree_7:
    - "1 — Strongly disagree"
    - "2"
    - "3"
    - "4 — Neither agree nor disagree"
    - "5"
    - "6"
    - "7 — Strongly agree"

questions:
  - id: q1
    n: 1
    page: 1
    section: "Temporary impasse"
    type: "single_select"
    style: "pills"
    required: true
    label: "At any point during this negotiation, did you experience a temporary impasse?"
    hint: "By temporary impasse, we mean a point when the negotiation seemed to stall and reaching an agreement appeared unlikely."
    options:
      - "Yes"
      - "No"

  - id: q2
    n: 2
    page: 1
    section: "Temporary impasse"
    type: "single_select"
    required: true
    show_if:
      question: "q1"
      equals: "Yes"
    label: "Approximately when did the first temporary impasse occur?"
    options:
      - "First quarter of the negotiation"
      - "Second quarter of the negotiation"
      - "Third quarter of the negotiation"
      - "Fourth quarter of the negotiation"

  - id: q3
    n: 3
    page: 1
    section: "Temporary impasse"
    type: "single_select"
    style: "pills"
    required: true
    show_if:
      question: "q1"
      equals: "Yes"
    label: "Did you and the other party eventually move past this temporary impasse?"
    options:
      - "Yes"
      - "No"

  - id: q4
    n: 4
    page: 1
    section: "How you approached the negotiation"
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I tried to understand what the other party was thinking in their situation."

  - id: q5
    n: 5
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I tried to imagine the negotiation from the other party’s point of view."

  - id: q6
    n: 6
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I carefully kept my own role and the information I was given in mind."

  - id: q7
    n: 7
    page: 2
    section: "What you learned"
    type: "likert"
    scale: "agree_7"
    required: true
    label: "This exercise helped me better distinguish what a negotiator asks for from the underlying reasons they care about it."

  - id: q8
    n: 8
    page: 2
    type: "likert"
    scale: "agree_7"
    required: true
    label: "This exercise helped me understand how changing or adding terms can create value for both parties."

  - id: q9
    n: 9
    page: 2
    type: "likert"
    scale: "agree_7"
    required: true
    label: "This exercise helped me recognize how my own choices helped or hindered progress."

  - id: q10
    n: 10
    page: 2
    section: "Reflecting on what happened"
    type: "open_text"
    required: true
    label: "Describe one moment that changed or confirmed what you thought mattered to the other party. What happened, and what did you do next?"
    hint: "A short response is fine."

  - id: q11
    n: 11
    page: 2
    type: "open_text"
    required: true
    label: "If you negotiated this case again, what is one thing you would do differently, and why?"
    hint: "A short response is fine."

  - id: q12
    n: 12
    page: 2
    section: "Continuing the learning"
    type: "multi_select"
    required: true
    max_selections: 2
    label: "Which two activities would help you learn most from this exercise?"
    hint: "Select up to two."
    options:
      - "Compare my strategy and outcome with other groups"
      - "See how both parties valued the offers"
      - "Examine an offer that could have created more value"
      - "Discuss why negotiations became stuck or moved forward"
      - "Review moments when new options or issues were introduced"
      - "Try the negotiation again or switch roles"
      - "Receive feedback on my negotiation strategy"

  - id: q13
    n: 13
    page: 2
    type: "open_text"
    required: false
    label: "Is there anything else that would be useful or interesting to discuss in class, or anything we should change about this activity?"
    hint: "Optional."
