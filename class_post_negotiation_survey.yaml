scales:
  agree_7:
    - "1 — Strongly disagree"
    - "2"
    - "3"
    - "4 — Neither agree nor disagree"
    - "5"
    - "6"
    - "7 — Strongly agree"
  svi_satisfaction_7:
    - "1 — Not at all satisfied"
    - "2"
    - "3"
    - "4 — Moderately satisfied"
    - "5"
    - "6"
    - "7 — Perfectly satisfied"
    - "N/A"
  compare_satisfaction_7:
    - "1 — Much less satisfied"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more satisfied"
  compare_realism_7:
    - "1 — Much less realistic"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more realistic"
  compare_ability_7:
    - "1 — Much less able"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more able"

questions:
  - id: q1
    n: 1
    page: 1
    section: "How you approached the negotiation"
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I tried to understand what the other party was thinking in their situation."

  - id: q2
    n: 2
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I tried to imagine the negotiation from the other party’s point of view."

  - id: q3
    n: 3
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "I was able to use my understanding of the other party to shape the questions I asked, the offers I made, or the way I responded."

  - id: q4
    n: 4
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I carefully kept my own role and the information I was given in mind."

  - id: q5
    n: 5
    page: 1
    section: "Your experience and outcome"
    type: "likert"
    scale: "svi_satisfaction_7"
    required: true
    label: "How satisfied are you with your own outcome—i.e., the extent to which the terms of your agreement (or lack of agreement) benefit you?"

  - id: q6
    n: 6
    page: 1
    type: "likert"
    scale: "compare_satisfaction_7"
    required: true
    label: "Compared with a negotiation in which you must negotiate over a predefined set of issues (e.g., New Recruit), how satisfied are you with the outcome of this negotiation, where you had flexibility in which issues you could introduce?"

  - id: q7
    n: 7
    page: 1
    type: "likert"
    scale: "compare_realism_7"
    required: true
    label: "Compared with a negotiation in which you must negotiate over a predefined set of issues, how realistic did this negotiation feel when you had flexibility in which issues you could introduce?"

  - id: q8
    n: 8
    page: 1
    type: "likert"
    scale: "compare_ability_7"
    required: true
    label: "Compared with negotiating over a predefined set of issues, how able were you to understand what mattered to the other party when you had flexibility in which issues you could introduce?"

  - id: q9
    n: 9
    page: 2
    section: "Comparing your strategies"
    type: "open_text"
    required: true
    label: "What was the main difference in how you prepared, communicated, or made offers between (a) a negotiation with a predefined set of issues, such as New Recruit, and (b) this negotiation, where you had flexibility in which issues you could introduce?"
    hint: "A short response is fine."

  - id: q10
    n: 10
    page: 2
    type: "open_text"
    required: true
    label: "Which negotiation principles or ideas from class were most useful when you had flexibility in which issues you could introduce? Were any harder to apply, or less useful, than when negotiating over a predefined set of issues?"
    hint: "A short response is fine."

  - id: q11
    n: 11
    page: 2
    section: "Taking the learning forward"
    type: "open_text"
    required: true
    label: "What is one lesson from this experience that you want to carry into a future negotiation? Be specific about what you would do."
    hint: "A short response is fine."

  - id: q12
    n: 12
    page: 2
    section: "When the negotiation felt stuck"
    type: "single_select"
    style: "pills"
    required: true
    label: "At any point, did the negotiation feel stuck? In other words, did you and the other party seem unable to make progress, or did reaching an agreement seem unlikely?"
    options:
      - "Yes, once"
      - "Yes, multiple times"
      - "No"

  - id: q13
    n: 13
    page: 2
    type: "multi_select"
    required: true
    show_if:
      question: "q12"
      not_equals: "No"
    label: "Roughly when did the negotiation feel stuck? Select all that apply."
    max_selections: 4
    options:
      - "1st quarter of the negotiation"
      - "2nd quarter of the negotiation"
      - "3rd quarter of the negotiation"
      - "4th quarter of the negotiation"

  - id: q14
    n: 14
    page: 2
    type: "open_text"
    required: true
    show_if:
      question: "q12"
      not_equals: "No"
    label: "Do you think you and the other party eventually got past the point or points where the negotiation felt stuck and began making progress again?"
    hint: "Begin with Yes, Partly, or No. If you became unstuck, describe what changed and what you and the other party did. If you did not, describe why the negotiation remained stuck."

  - id: q15
    n: 15
    page: 2
    type: "open_text"
    required: true
    show_if:
      question: "q12"
      not_equals: "No"
    label: "If you have felt stuck in a negotiation with a predefined set of issues, such as New Recruit, did being stuck in this negotiation feel different? What was different about why you became stuck or how you moved forward?"
    hint: "If you did not feel stuck in those earlier negotiations, simply say so. A short response is fine."

  - id: q16
    n: 16
    page: 2
    type: "open_text"
    required: false
    show_if:
      question: "q12"
      equals: "No"
    label: "Why do you think this negotiation did not feel stuck?"
    hint: "Optional. A short response is fine."

  - id: q17
    n: 17
    page: 2
    section: "Other feedback"
    type: "open_text"
    required: false
    label: "Is there anything else that would be useful or interesting to discuss in class, or anything we should change about this activity?"
    hint: "Optional."
