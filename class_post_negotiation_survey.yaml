scales:
  agree_7:
    - "1 — Strongly disagree"
    - "2"
    - "3"
    - "4 — Neither agree nor disagree"
    - "5"
    - "6"
    - "7 — Strongly agree"
  svi_satisfaction_7:
    - "1 — Not at all satisfied"
    - "2"
    - "3"
    - "4 — Moderately satisfied"
    - "5"
    - "6"
    - "7 — Perfectly satisfied"
    - "N/A"
  compare_satisfaction_7:
    - "1 — Much less satisfied"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more satisfied"
  compare_realism_7:
    - "1 — Much less realistic"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more realistic"
  compare_ability_7:
    - "1 — Much less able"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more able"

questions:
  - id: q1
    n: 1
    page: 1
    section: "How you approached the negotiation"
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I tried to understand what the other party was thinking in their situation."

  - id: q2
    n: 2
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I tried to imagine the negotiation from the other party’s point of view."

  - id: q3
    n: 3
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "I was able to use my understanding of the other party to shape the questions I asked, the offers I made, or the way I responded."

  - id: q4
    n: 4
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I carefully kept my own role and the information I was given in mind."

  - id: q5
    n: 5
    page: 1
    section: "Your experience and outcome"
    type: "likert"
    scale: "svi_satisfaction_7"
    required: true
    label: "How satisfied are you with your own outcome—i.e., the extent to which the terms of your agreement (or lack of agreement) benefit you?"

  - id: q6
    n: 6
    page: 1
    type: "likert"
    scale: "compare_satisfaction_7"
    required: true
    label: "Compared with fixed-issue negotiations you have completed, how satisfied are you with the outcome of this negotiation?"

  - id: q7
    n: 7
    page: 1
    type: "likert"
    scale: "compare_realism_7"
    required: true
    label: "Compared with fixed-issue negotiations you have completed, how realistic did this negotiation feel?"

  - id: q8
    n: 8
    page: 1
    type: "likert"
    scale: "compare_ability_7"
    required: true
    label: "Compared with fixed-issue negotiations, how able were you to understand what mattered to the other party in this negotiation?"

  - id: q9
    n: 9
    page: 2
    section: "Comparing your strategies"
    type: "open_text"
    required: true
    label: "What was the main difference in how you prepared, communicated, or made offers when you could raise issues beyond a fixed list?"
    hint: "A short response is fine."

  - id: q10
    n: 10
    page: 2
    type: "open_text"
    required: true
    label: "Which negotiation principles or ideas from class were most useful here? Were any harder to apply, or less useful, than in a fixed-issue negotiation?"
    hint: "A short response is fine."

  - id: q11
    n: 11
    page: 2
    section: "Taking the learning forward"
    type: "open_text"
    required: true
    label: "What is one lesson from this experience that you want to carry into a future negotiation? Be specific about what you would do."
    hint: "A short response is fine."

  - id: q12
    n: 12
    page: 2
    type: "multi_select"
    required: true
    max_selections: 2
    label: "Which two activities would be most useful or interesting for the class debrief?"
    hint: "Select up to two."
    options:
      - "Compare strategies and outcomes across groups"
      - "See how both parties valued the offers"
      - "Examine an offer that could have created more value"
      - "Discuss why negotiations became stuck or moved forward"
      - "Compare open and fixed-issue negotiation strategies"
      - "Discuss how perspective taking was translated into action"
      - "Try the negotiation again or switch roles"

  - id: q13
    n: 13
    page: 2
    type: "open_text"
    required: false
    label: "Is there anything else that would be useful or interesting to discuss in class, or anything we should change about this activity?"
    hint: "Optional."
