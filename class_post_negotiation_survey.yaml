scales:
  agree_7:
    - "1 — Strongly disagree"
    - "2"
    - "3"
    - "4 — Neither agree nor disagree"
    - "5"
    - "6"
    - "7 — Strongly agree"
  agree_5:
    - "1 — Strongly disagree"
    - "2 — Disagree"
    - "3 — Neither agree nor disagree"
    - "4 — Agree"
    - "5 — Strongly agree"
  svi_satisfaction_7:
    - "1 — Not at all satisfied"
    - "2"
    - "3"
    - "4 — Moderately satisfied"
    - "5"
    - "6"
    - "7 — Perfectly satisfied"
    - "N/A"
  compare_satisfaction_7:
    - "1 — Much less satisfied"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more satisfied"
  compare_realism_7:
    - "1 — Much less realistic"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more realistic"
  compare_creativity_7:
    - "1 — Much less creative"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more creative"
  compare_confidence_7:
    - "1 — Much less confident"
    - "2"
    - "3"
    - "4 — About the same"
    - "5"
    - "6"
    - "7 — Much more confident"

questions:
  - id: q1
    n: 1
    page: 1
    section: "How you approached the negotiation"
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I tried to understand what the other party was thinking in their situation."

  - id: q2
    n: 2
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I tried to imagine the negotiation from the other party’s point of view."

  - id: q3
    n: 3
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "I was able to use my understanding of the other party to shape the questions I asked, the offers I made, or the way I responded."

  - id: q4
    n: 4
    page: 1
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During the negotiation, I carefully kept my own role and the information I was given in mind."

  - id: q5
    n: 5
    page: 1
    section: "Your experience and outcome"
    type: "likert"
    scale: "svi_satisfaction_7"
    required: true
    label: "How satisfied are you with your own outcome—i.e., the extent to which the terms of your agreement (or lack of agreement) benefit you?"

  - id: q6
    n: 6
    page: 1
    type: "likert"
    scale: "compare_satisfaction_7"
    required: true
    label: "Compared with previous classroom negotiations where the possible outcomes and issues were fixed (e.g., New Recruit), how satisfied are you with the outcome of this negotiation?"

  - id: q7
    n: 7
    page: 1
    type: "likert"
    scale: "compare_realism_7"
    required: true
    label: "Compared with previous classroom negotiations where the possible outcomes and issues were fixed (e.g., New Recruit), how realistic did this negotiation feel?"

  - id: q8
    n: 8
    page: 1
    type: "likert"
    scale: "compare_creativity_7"
    required: true
    label: "Compared with previous classroom negotiations where the possible outcomes and issues were fixed (e.g., New Recruit), how creative did you feel?"

  - id: q20
    n: 9
    page: 1
    type: "likert"
    scale: "compare_confidence_7"
    required: true
    label: "Compared with previous classroom negotiations where the possible outcomes and issues were fixed (e.g., New Recruit), how confident were you in your ability to come up with creative ideas?"

  - id: q21
    n: 10
    page: 1
    type: "likert"
    scale: "compare_confidence_7"
    required: true
    label: "Compared with previous classroom negotiations where the possible outcomes and issues were fixed (e.g., New Recruit), how confident were you in your ability to solve negotiation problems creatively?"

  - id: q9
    n: 11
    page: 2
    section: "Comparing your strategies"
    type: "open_text"
    required: true
    label: "How did your strategy in this negotiation differ from previous classroom negotiations with fixed issues and outcomes (e.g., New Recruit)?"
    hint: "A short response is fine."

  - id: q10
    n: 12
    page: 2
    type: "open_text"
    required: true
    label: "Which negotiation principles or ideas from class were most useful in this type of negotiation?"
    hint: "A short response is fine."

  - id: q11
    n: 13
    page: 2
    section: "Taking the learning forward"
    type: "open_text"
    required: true
    label: "What is one lesson from this experience that you want to carry into a future negotiation? Be specific about what you would do."
    hint: "A short response is fine."

  - id: q12
    n: 14
    page: 2
    section: "When the negotiation felt stuck"
    type: "single_select"
    style: "pills"
    required: true
    label: "At any point, did the negotiation feel stuck? In other words, did you and the other party seem unable to make progress, or did reaching an agreement seem unlikely?"
    options:
      - "Yes, once"
      - "Yes, multiple times"
      - "No"

  - id: q13
    n: 15
    page: 2
    type: "multi_select"
    required: true
    show_if:
      question: "q12"
      not_equals: "No"
    label: "Roughly when did the negotiation feel stuck? Select all that apply."
    max_selections: 4
    options:
      - "1st quarter of the negotiation"
      - "2nd quarter of the negotiation"
      - "3rd quarter of the negotiation"
      - "4th quarter of the negotiation"

  - id: q14
    n: 16
    page: 2
    type: "open_text"
    required: true
    show_if:
      question: "q12"
      not_equals: "No"
    label: "Do you think you and the other party eventually got past the point or points where the negotiation felt stuck and began making progress again?"
    hint: "Begin with Yes, Partly, or No. If you became unstuck, describe what changed and what you and the other party did. If you did not, describe why the negotiation remained stuck."

  - id: q15
    n: 17
    page: 2
    type: "open_text"
    required: true
    show_if:
      question: "q12"
      not_equals: "No"
    label: "If you have felt stuck in a negotiation with a predefined set of issues, such as New Recruit, did being stuck in this negotiation feel different? What was different about why you became stuck or how you moved forward?"
    hint: "If you did not feel stuck in those earlier negotiations, simply say so. A short response is fine."

  - id: q16
    n: 18
    page: 2
    type: "open_text"
    required: false
    show_if:
      question: "q12"
      equals: "No"
    label: "Why do you think this negotiation did not feel stuck?"
    hint: "Optional. A short response is fine."

  - id: q18
    n: 19
    page: 2
    section: "Offer scoring"
    type: "likert"
    scale: "agree_5"
    required: true
    label: "The scores my offers received were consistent with the interests and priorities described in my role narrative."

  - id: q19
    n: 20
    page: 2
    type: "open_text"
    required: false
    label: "Please explain your answer to the previous question."
    hint: "Optional."

  - id: q22
    n: 21
    page: 2
    type: "open_text"
    required: false
    label: "Do you recall any issues that should have been scored differently for your role?"
    hint: "Optional. Name the issue, suggest a positive, zero or negative score, and briefly explain why."

  - id: q23
    n: 22
    page: 2
    type: "open_text"
    required: false
    label: "Are there any other creative ideas or issues you think should be included in this negotiation?"
    hint: "Optional. For each idea, suggest −1, 0 or +1 for the Candidate and for the Recruiter, and briefly explain why."

  - id: q24
    n: 23
    page: 2
    type: "open_text"
    required: false
    label: "Any other feedback on this exercise?"
    hint: "Optional."
