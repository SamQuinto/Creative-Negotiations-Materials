scales:
  svi_positive_7:
    - "1 — Not at all"
    - "2"
    - "3"
    - "4 — Moderately"
    - "5"
    - "6"
    - "7 — Perfectly"
    - "N/A"
  svi_loss_7:
    - "1 — Not at all"
    - "2"
    - "3"
    - "4 — Moderately"
    - "5"
    - "6"
    - "7 — A great deal"
    - "N/A"
  svi_competence_7:
    - "1 — It made me feel less competent"
    - "2"
    - "3"
    - "4 — It did not make me feel more or less competent"
    - "5"
    - "6"
    - "7 — It made me feel more competent"
    - "N/A"
  svi_self_image_7:
    - "1 — It negatively impacted my self-image"
    - "2"
    - "3"
    - "4 — It did not positively or negatively impact my self-image"
    - "5"
    - "6"
    - "7 — It positively impacted my self-image"
    - "N/A"
  svi_satisfaction_7:
    - "1 — Not at all satisfied"
    - "2"
    - "3"
    - "4 — Moderately satisfied"
    - "5"
    - "6"
    - "7 — Perfectly satisfied"
    - "N/A"
  svi_impression_7:
    - "1 — Extremely negative"
    - "2"
    - "3"
    - "4 — Neither negative nor positive"
    - "5"
    - "6"
    - "7 — Extremely positive"
    - "N/A"
  agree_7:
    - "1 — Strongly disagree"
    - "2"
    - "3"
    - "4 — Neither agree nor disagree"
    - "5"
    - "6"
    - "7 — Strongly agree"
  frequency_5:
    - "Never"
    - "Rarely"
    - "Occasionally"
    - "Frequently"
    - "Very frequently"

questions:
  - id: q1
    n: 1
    page: 1
    section: "Your outcome"
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "How satisfied are you with your own outcome—i.e., the extent to which the terms of your agreement (or lack of agreement) benefit you?"

  - id: q2
    n: 2
    page: 1
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "How satisfied are you with the balance between your own outcome and your counterpart’s outcome?"

  - id: q3
    n: 3
    page: 1
    type: "likert"
    scale: "svi_loss_7"
    required: true
    reverse_scored: true
    label: "Did you feel like you forfeited or ‘lost’ in this negotiation?"

  - id: q4
    n: 4
    page: 1
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "Do you think the terms of your agreement are consistent with principles of legitimacy or objective criteria (e.g., common standards of fairness, precedent, industry practice, legality, etc.)?"

  - id: q5
    n: 5
    page: 1
    section: "How you felt about yourself"
    type: "likert"
    scale: "svi_loss_7"
    required: true
    reverse_scored: true
    label: "Did you ‘lose face’ (i.e., damage your sense of pride) in the negotiation?"

  - id: q6
    n: 6
    page: 1
    type: "likert"
    scale: "svi_competence_7"
    required: true
    label: "Did this negotiation make you feel more or less competent as a negotiator?"

  - id: q7
    n: 7
    page: 1
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "Did you behave according to your own principles and values?"

  - id: q8
    n: 8
    page: 1
    type: "likert"
    scale: "svi_self_image_7"
    required: true
    label: "Did this negotiation positively or negatively impact your self-image or your impression of yourself?"

  - id: q9
    n: 9
    page: 1
    section: "The negotiation process"
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "Do you feel your counterpart listened to your concerns?"

  - id: q10
    n: 10
    page: 1
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "Would you characterize the negotiation process as fair?"

  - id: q11
    n: 11
    page: 1
    type: "likert"
    scale: "svi_satisfaction_7"
    required: true
    label: "How satisfied are you with the ease (or difficulty) of reaching an agreement?"

  - id: q12
    n: 12
    page: 1
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "Did your counterpart consider your wishes, opinions, or needs?"

  - id: q13
    n: 13
    page: 1
    section: "Your relationship with the other party"
    type: "likert"
    scale: "svi_impression_7"
    required: true
    label: "What kind of ‘overall’ impression did your counterpart make on you?"

  - id: q14
    n: 14
    page: 1
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "How satisfied are you with your relationship with your counterpart as a result of this negotiation?"

  - id: q15
    n: 15
    page: 1
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "Did the negotiation make you trust your counterpart?"

  - id: q16
    n: 16
    page: 1
    type: "likert"
    scale: "svi_positive_7"
    required: true
    label: "Did the negotiation build a good foundation for a future relationship with your counterpart?"

  - id: q17
    n: 17
    page: 2
    section: "Your experience"
    type: "likert"
    scale: "agree_7"
    required: true
    label: "I had no difficulty imagining myself in this negotiation."

  - id: q18
    n: 18
    page: 2
    type: "likert"
    scale: "agree_7"
    required: true
    label: "This negotiation felt realistic."

  - id: q19
    n: 19
    page: 2
    type: "likert"
    scale: "agree_7"
    required: true
    label: "I took my assigned role seriously."

  - id: q20
    n: 20
    page: 2
    section: "Generating ideas"
    type: "likert"
    scale: "frequency_5"
    required: true
    label: "I considered diverse sources of information when generating new ideas."

  - id: q21
    n: 21
    page: 2
    type: "likert"
    scale: "frequency_5"
    required: true
    label: "I looked for connections with solutions used in seemingly different situations."

  - id: q22
    n: 22
    page: 2
    type: "likert"
    scale: "frequency_5"
    required: true
    label: "I generated several alternatives to the same problem before deciding what to propose."

  - id: q23
    n: 23
    page: 2
    type: "likert"
    scale: "frequency_5"
    required: true
    label: "I tried to devise solutions that moved away from established ways of doing things."

  - id: q24
    n: 24
    page: 2
    type: "likert"
    scale: "frequency_5"
    required: true
    label: "I spent considerable time working through information that helped me generate new ideas."

  - id: q25
    n: 25
    page: 2
    section: "Creative confidence"
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During this negotiation, I was confident that I could solve problems creatively."

  - id: q26
    n: 26
    page: 2
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During this negotiation, I felt able to build further on ideas raised by the other party."

  - id: q27
    n: 27
    page: 2
    type: "likert"
    scale: "agree_7"
    required: true
    label: "During this negotiation, I felt capable of generating novel ideas."

  - id: q28
    n: 28
    page: 2
    section: "Temporary impasse"
    type: "single_select"
    style: "pills"
    required: true
    label: "At any point during this negotiation, did you experience a temporary impasse?"
    hint: "By temporary impasse, we mean a point when the negotiation seemed to stall and reaching an agreement appeared unlikely."
    options:
      - "Yes"
      - "No"

  - id: q29
    n: 29
    page: 2
    section: "Temporary impasse"
    type: "open_text"
    required: true
    show_if:
      question: "q28"
      equals: "Yes"
    label: "Please briefly describe what the temporary impasse or disagreement was about and why you think it happened."
    hint: "A short response is fine."

  - id: q30
    n: 30
    page: 2
    section: "Temporary impasse"
    type: "single_select"
    required: true
    show_if:
      question: "q28"
      equals: "Yes"
    label: "Approximately when did the first temporary impasse occur?"
    options:
      - "First quarter of the negotiation"
      - "Second quarter of the negotiation"
      - "Third quarter of the negotiation"
      - "Fourth quarter of the negotiation"

  - id: q31
    n: 31
    page: 2
    section: "Temporary impasse"
    type: "single_select"
    style: "pills"
    required: true
    show_if:
      question: "q28"
      equals: "Yes"
    label: "Do you feel that you and the other party eventually moved past this temporary impasse?"
    options:
      - "Yes"
      - "No"

  - id: q32
    n: 32
    page: 2
    section: "Temporary impasse"
    type: "open_text"
    required: true
    show_if:
      question: "q31"
      equals: "Yes"
    label: "How do you think you moved past it?"
    hint: "A short response is fine."

  - id: q33
    n: 33
    page: 2
    section: "Other feedback"
    type: "open_text"
    required: false
    label: "Do you have any other feedback about this negotiation task, or any comments, thoughts, or feelings about your experience that you would like to share with us?"
    hint: "Optional."
